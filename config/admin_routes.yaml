mulertech_blog_admin_index:
    path: ''
    controller: mulertech_blog.controller.admin::index
    methods: [GET]

mulertech_blog_admin_new:
    path: /new
    controller: mulertech_blog.controller.admin::new
    methods: [GET, POST]

mulertech_blog_admin_edit:
    path: /{id}
    controller: mulertech_blog.controller.admin::edit
    methods: [GET, POST]
    requirements: { id: '\d+' }

mulertech_blog_admin_preview:
    path: /{id}/preview
    controller: mulertech_blog.controller.blog::preview
    methods: [GET]
    requirements: { id: '\d+' }

mulertech_blog_admin_delete:
    path: /{id}/delete
    controller: mulertech_blog.controller.admin::delete
    methods: [POST]
    requirements: { id: '\d+' }

mulertech_blog_admin_publish:
    path: /{id}/publish
    controller: mulertech_blog.controller.admin::publish
    methods: [POST]
    requirements: { id: '\d+' }

mulertech_blog_admin_schedule:
    path: /{id}/schedule
    controller: mulertech_blog.controller.admin::schedule
    methods: [POST]
    requirements: { id: '\d+' }
mulertech_blog_admin_unpublish:
    path: /{id}/unpublish
    controller: mulertech_blog.controller.admin::unpublish
    methods: [POST]
    requirements: { id: '\d+' }

mulertech_blog_admin_file_add:
    path: /{id}/files
    controller: mulertech_blog.controller.admin::addFile
    methods: [POST]
    requirements: { id: '\d+' }

mulertech_blog_admin_file_remove:
    path: /{id}/files/{fileId}/remove
    controller: mulertech_blog.controller.admin::removeFile
    methods: [POST]
    requirements: { id: '\d+', fileId: '\d+' }

mulertech_blog_admin_file:
    path: /{id}/files/{fileId}
    controller: mulertech_blog.controller.admin::file
    methods: [GET]
    requirements: { id: '\d+', fileId: '\d+' }

mulertech_blog_admin_category_index:
    path: /categories
    controller: mulertech_blog.controller.admin_category::index
    methods: [GET]
mulertech_blog_admin_category_new:
    path: /categories/new
    controller: mulertech_blog.controller.admin_category::new
    methods: [GET, POST]
mulertech_blog_admin_category_edit:
    path: /categories/{id}
    controller: mulertech_blog.controller.admin_category::edit
    methods: [GET, POST]
    requirements: { id: '\d+' }
mulertech_blog_admin_category_delete:
    path: /categories/{id}/delete
    controller: mulertech_blog.controller.admin_category::delete
    methods: [POST]
    requirements: { id: '\d+' }

mulertech_blog_admin_tag_index:
    path: /tags
    controller: mulertech_blog.controller.admin_tag::index
    methods: [GET]
mulertech_blog_admin_tag_new:
    path: /tags/new
    controller: mulertech_blog.controller.admin_tag::new
    methods: [GET, POST]
mulertech_blog_admin_tag_edit:
    path: /tags/{id}
    controller: mulertech_blog.controller.admin_tag::edit
    methods: [GET, POST]
    requirements: { id: '\d+' }
mulertech_blog_admin_tag_delete:
    path: /tags/{id}/delete
    controller: mulertech_blog.controller.admin_tag::delete
    methods: [POST]
    requirements: { id: '\d+' }
