mulertech_blog_index:
    path: ''
    controller: mulertech_blog.controller.blog::index
    methods: [GET]

# Before the article route, whose slug would otherwise take `feed.xml`.
mulertech_blog_feed:
    path: /feed.xml
    controller: mulertech_blog.controller.feed
    methods: [GET]

mulertech_blog_file:
    path: /{slug}/files/{id}
    controller: mulertech_blog.controller.file
    methods: [GET]
    requirements:
        id: '\d+'

mulertech_blog_show:
    path: /{slug}
    controller: mulertech_blog.controller.blog::show
    methods: [GET]
